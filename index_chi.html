<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="website_logo_transparent.png" type="image/x-icon">
    <title>Frank HAU | 個人履歷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-section">
        <!-- Top Responsive Header Bar -->
        <header>
            <a href="#" class="logo">
                <img src="website_logo_transparent.png" alt="Frank Hau logo">
                <span class="logo-text">frankhau</span>
            </a>
            
            <!-- Hamburger Menu Button Visible only on Mobile/Tablet UI -->
            <button class="menu-toggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Adaptive Navigation Container -->
            <nav>
                <ul>
                    <li><a href="#" class="active">主頁</a></li>
                    <li><a href="guitarmain/index.html">結他神棍之家</a></li>
                    <li><a href="#">服務</a></li>
                    <li><a href="#">作品集</a></li>
                    <li><a href="#">個人摘要</a></li>
                    <li><a href="#">聯絡</a></li>
                </ul>
            </nav>
        </header>

        <!-- Dynamic Grid Container -->
        <div class="container">
            <div class="content-left">
                <p class="subtitle">歡迎來到我的專屬空間</p>
                <h1>我是 <span>Frank Hau</span></h1>
                <p class="description">
                    歡迎！我係 Frank HAU。一位熱愛探索的探險家，致力於將全球視野轉化為實際有效的解決方案。我對自我提升嘅追求，完全體現喺我多元化嘅興趣當中——不論係長跑、潛水，定係學習新語言同音樂，我都充滿熱誠。我會將呢種充滿活力、永不停步嘅學習心態，全情投入到每一個專業項目之中。
                </p>
                <div class="btn-group">
                    <a href="index.html" class="btn btn-secondary">English</a>
                    <a href="#" class="btn btn-primary">關於我</a>
                </div>
            </div>

            <!-- Profile Space (Adapts scale and shifts order context-sensitively across screens) -->
            <div class="content-right">
                <!-- Drop a transparent PNG photo here if you want to display an image (like the woman in templete.webp) -->
                <!-- <img src="your-transparent-profile.png" alt="Frank Hau" style="max-width: 90%; height: auto;"> -->
            </div>
        </div>
    </section>

    <!-- UI Script Handles Responsive Menu Interaction -->
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('nav');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Auto-closes mobile tray instantly upon active link interaction
        document.querySelectorAll('nav ul li a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
